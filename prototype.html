    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;

  .phone-shell {
    width: 390px;
    height: 844px;
    background: #0D0D0F;
    border-radius: 44px;
    border: 8px solid #2a2a2a;
    box-shadow: 0 0 0 2px #1a1a1a, 0 40px 80px rgba(0,0,0,0.8), inset 0 0 0 1px #333;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;

    position: absolute;
    top: 0; left: 50%;

    width: 126px; height: 34px;
    background: #2a2a2a;
    border-radius: 0 0 20px 20px;
    z-index: 999;
  }

    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    margin-top: 34px;

function GradientText({ children, style={} }) {

      WebkitTextFillColor: 'transparent',

}

function GridTile({ user, onClick }) {
  return (
    <div onClick={() => onClick(user)} style={{
      position:'relative', aspectRatio:'1/1.1', borderRadius:12,
      overflow:'hidden', cursor:'pointer', flexShrink:0,
    }}>
      <img
        src={user.photos[0]}
        style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}
        loading="lazy"
      />
      {/* Gradient overlay */}
      <div style={{
        position:'absolute', bottom:0, left:0, right:0, height:'60%',
        background:'linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%)',
      }}/>
      {/* Online dot */}
      {user.online && (
        <div style={{
          position:'absolute', top:7, left:7,
          width:10, height:10, borderRadius:5,
          background:C.online,
          border:'2px solid #0D0D0F',
          boxShadow:`0 0 6px ${C.online}88`,
        }}/>
      )}
      {/* Verified badge */}
      {user.verified && (
        <div style={{
          position:'absolute', top:6, right:6,
          background:`linear-gradient(135deg, ${C.accent}, ${C.mauve})`,
          borderRadius:10, padding:'2px 6px',
          fontSize:9, color:'#fff', fontWeight:600,
        }}>✓</div>
      )}
      {/* Name + distance */}
      <div style={{ position:'absolute', bottom:6, left:7, right:7 }}>
        <div style={{ color:'#fff', fontSize:12, fontWeight:600, lineHeight:1.2 }}>{user.name}</div>
        <div style={{ color:'rgba(255,255,255,0.7)', fontSize:10 }}>{user.distance}</div>
      </div>
    </div>
  );
}

                border:`1px solid ${f==='Nearby'?C.accent:C.border}`,
                borderRadius:20, padding:'6px 14px',

          <div style={{ display:'flex', gap:12, alignItems:'center' }}>
            <span style={{ color:C.text2, fontSize:13 }}>Max distance:</span>

            <span style={{ color:C.text, fontSize:13, width:40 }}>10 km</span>

      <QuickExit onPress={onQuickExit} />
    </div>
  );
}

          {user.verified && (
            <GradientBadge>✓ Verified</GradientBadge>

          {user.online && (

        {/* Bio */}

          background:C.bgCard, borderRadius:12, padding:14,
          marginBottom:16, border:`1px solid ${C.border}`,
        }}>
          <div style={{ color:C.text, fontSize:14, lineHeight:1.6 }}>
            {bioExpanded || user.bio.length < 80
              ? user.bio
              : user.bio.slice(0, 80) + '...'}

          {user.bio.length > 80 && (
            <button onClick={() => setBioExpanded(!bioExpanded)} style={{
              background:'none', border:'none', color:C.accent,
              fontSize:13, cursor:'pointer', padding:'6px 0 0',

        {/* Identity tags */}
        <div style={{ ...S.label, marginBottom:8 }}>Identity</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:16 }}>
          {user.identity.map(t => <Pill key={t} label={t} color="mauve"/>)}

        {/* Looking for tags */}
        <div style={{ ...S.label, marginBottom:8 }}>Looking for</div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:24 }}>
          {user.looking.map(t => <Pill key={t} label={t} color="rose"/>)}

        {/* Action buttons */}
        <div style={{ display:'flex', gap:10, marginBottom:16 }}>

            flex:1, background:`linear-gradient(135deg,${C.accent},${C.mauve})`,

            background: liked ? 'rgba(194,82,122,0.2)' : C.bgCard,

            display:'flex', alignItems:'center', justifyContent:'center',

            background:C.bgCard, border:`1px solid ${C.border}`,

        {/* Report */}
        <button onClick={() => setShowReport(true)} style={{
          background:'none', border:'none', color:C.text2,
          fontSize:13, cursor:'pointer', textDecoration:'underline',
          display:'block', margin:'0 auto 8px',

      </div>

      {/* Report modal */}
      {showReport && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,0.75)',

          <div onClick={e => e.stopPropagation()} style={{
            background:C.bg2, borderRadius:'20px 20px 0 0',

  );
}

// CHAT DETAIL
// ─────────────────────────────────────────────
function ChatDetailScreen({ conversation, navigate, onQuickExit }) {
  const [msgs, setMsgs] = React.useState(MESSAGES);
  const [input, setInput] = React.useState('');
  const [showMenu, setShowMenu] = React.useState(false);
  const [showSafetyBanner, setShowSafetyBanner] = React.useState(true);
  const bottomRef = React.useRef(null);
  const user = conversation?.user || USERS[0];

  const send = () => {
    if (!input.trim()) return;
    setMsgs(m => [...m, { id:Date.now(), from:'me', text:input.trim(), time:'now' }]);
    setInput('');
    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior:'smooth' }), 50);
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      <Header
        left={<IconBtn label="←" onClick={() => navigate('back')} />}
        title={
          <div style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}
               onClick={() => navigate('profile-detail', user)}>
            <img src={user.photos[0]} style={{ width:32, height:32, borderRadius:16, objectFit:'cover' }}/>
            <div>
              <div style={{ fontSize:15, fontWeight:600, color:C.text, lineHeight:1.1 }}>{user.name}</div>
              <div style={{ fontSize:11, color:user.online?C.online:C.text2 }}>
                {user.online ? '● Online' : 'Offline'}
              </div>
            </div>
          </div>
        }
        right={<IconBtn label="⋯" onClick={() => setShowMenu(!showMenu)} />}
      />

      {/* 3-dot menu */}
      {showMenu && (
        <div style={{
          position:'absolute', top:52, right:12, zIndex:500,
          background:C.bg2, border:`1px solid ${C.border}`,
          borderRadius:12, overflow:'hidden', minWidth:160,
        }}>
          {['View profile','Block user','Report user','Unmatch'].map(item => (
            <button key={item} onClick={() => setShowMenu(false)} style={{
              display:'block', width:'100%', textAlign:'left',
              background:'none', border:'none', borderBottom:`1px solid ${C.border}`,
              padding:'13px 16px', color: item.includes('Block')||item.includes('Report')?C.danger:C.text,
              fontSize:14, cursor:'pointer',
            }}>{item}</button>
          ))}
        </div>
      )}

      {/* Safety banner (first message) */}
      {showSafetyBanner && (
        <div style={{
          background:'rgba(139,94,140,0.15)', border:`1px solid ${C.mauve}`,
          margin:'8px 12px', borderRadius:10,
          padding:'10px 12px',
          display:'flex', gap:10, alignItems:'flex-start',
        }}>
          <span>🛡</span>
          <div style={{ flex:1 }}>
            <div style={{ color:C.text, fontSize:12, fontWeight:600, marginBottom:2 }}>Safety tip</div>
            <div style={{ color:C.text2, fontSize:11, lineHeight:1.5 }}>
              Never share personal info. Meet in public first. Trust your gut.
            </div>
          </div>
          <button onClick={() => setShowSafetyBanner(false)} style={{
            background:'none', border:'none', color:C.text2, cursor:'pointer', fontSize:16, padding:0,
          }}>✕</button>
        </div>
      )}

      {/* Messages */}
      <div style={{ flex:1, overflowY:'auto', padding:'8px 12px' }}>
        {msgs.map(msg => (
          <div key={msg.id} style={{
            display:'flex', justifyContent: msg.from==='me'?'flex-end':'flex-start',
            marginBottom:8,
          }}>
            <div style={{
              maxWidth:'72%',
              background: msg.from==='me'
                ? `linear-gradient(135deg, ${C.accent}, ${C.mauve})`
                : C.bgCard,
              borderRadius: msg.from==='me' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              padding:'10px 14px',
              border: msg.from==='them' ? `1px solid ${C.border}` : 'none',
            }}>
              <div style={{ color:'#fff', fontSize:14, lineHeight:1.5 }}>{msg.text}</div>
              <div style={{ color: msg.from==='me'?'rgba(255,255,255,0.6)':'#9E8FA0', fontSize:10, marginTop:4, textAlign:'right' }}>
                {msg.time}
              </div>
            </div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{
        display:'flex', alignItems:'center', gap:10,
        padding:'10px 12px',
        background:C.bg2, borderTop:`1px solid ${C.border}`,
      }}>
        <button style={{
          background:C.bgCard, border:`1px solid ${C.border}`,
          borderRadius:20, width:36, height:36, cursor:'pointer',
          color:C.text2, fontSize:18, flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>📷</button>
        <input
          value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key==='Enter' && send()}
          placeholder="Message..."
          style={{
            flex:1, background:C.bgCard, border:`1px solid ${C.border}`,
            borderRadius:20, padding:'10px 16px',
            color:C.text, fontSize:14, outline:'none', fontFamily:'inherit',
          }}
        />
        <button onClick={send} style={{
          background: input.trim() ? `linear-gradient(135deg,${C.accent},${C.mauve})` : C.bgCard,
          border: input.trim() ? 'none' : `1px solid ${C.border}`,
          borderRadius:20, width:36, height:36, cursor:'pointer',
          color: input.trim() ? '#fff' : C.text2, fontSize:18, flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center',
          transition:'background 0.2s',
        }}>↑</button>
      </div>
      <QuickExit onPress={onQuickExit} />
    </div>
  );
}

function MyProfileScreen({ onQuickExit }) {

          {/* Bio */}

            <div style={{ ...S.label, marginBottom:6 }}>Bio</div>

                  background: selLooking.includes(t) ? 'rgba(194,82,122,0.2)' : 'none',
                  border: `1px solid ${selLooking.includes(t)?C.accent:C.border}`,
                  borderRadius:20, padding:'6px 14px',
                  color: selLooking.includes(t)?C.accent:C.text2,

                }}>{t}</button>
              ))}

          </div>

          {/* Privacy toggles */}
          <div style={{ background:C.bgCard, borderRadius:12, border:`1px solid ${C.border}`, overflow:'hidden' }}>
            <div style={{ ...S.label, padding:'12px 16px 4px' }}>Privacy</div>
            {[
              { label:'Incognito mode', sub:'Hide from grid unless you like them first', val:incognito, set:setIncognito },
              { label:'Hide my profile', sub:'Completely invisible to other users', val:hideProfile, set:setHideProfile },

                padding:'12px 16px', borderTop:`1px solid ${C.border}`,

                <Toggle value={val} onToggle={() => set(!val)}/>

            ))}

      </div>

      <QuickExit onPress={onQuickExit} />
    </div>
  );
}

    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      <Header
        left={<IconBtn label="←" onClick={() => setShowVerify(false)} />}
        title="Photo Verification"
      />
      <div style={{ flex:1, overflowY:'auto', padding:24, display:'flex', flexDirection:'column', gap:20, alignItems:'center' }}>
        <div style={{ ...S.heading, textAlign:'center' }}>Verify your identity</div>
        <div style={{ color:C.text2, fontSize:14, textAlign:'center', lineHeight:1.6 }}>
          Take a selfie matching the pose shown below to confirm you're a real person.
        </div>
        {/* Pose reference */}
        <div style={{
          width:180, height:220, borderRadius:16,
          border:`2px dashed ${C.mauve}`,
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          gap:12, background:'rgba(139,94,140,0.05)',
        }}>
          <div style={{ fontSize:64 }}>🤳</div>
          <div style={{ color:C.mauve, fontSize:13, fontWeight:500, textAlign:'center', padding:'0 16px' }}>
            Hold your right hand up with two fingers
          </div>
        </div>
        <div style={{
          background:C.bgCard, borderRadius:12, border:`1px solid ${C.border}`,
          padding:16, width:'100%',
        }}>
          {['Face clearly visible','Good lighting','Match the pose','No filters or masks'].map(s => (
            <div key={s} style={{ display:'flex', alignItems:'center', gap:10, paddingBlock:6 }}>
              <span style={{ color:C.online, fontSize:16 }}>✓</span>
              <span style={{ color:C.text, fontSize:13 }}>{s}</span>
            </div>
          ))}
        </div>
        <button style={{
          background:`linear-gradient(135deg,${C.accent},${C.mauve})`,
          border:'none', borderRadius:24, padding:'16px 48px',
          color:'#fff', fontSize:15, fontWeight:600, cursor:'pointer',
          boxShadow:`0 4px 16px rgba(194,82,122,0.3)`, width:'100%',
        }}>📷 Take Verification Selfie</button>
      </div>
    </div>
  );

  if (showBlockList) return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      <Header
        left={<IconBtn label="←" onClick={() => setShowBlockList(false)} />}
        title="Blocked Users"
      />
      <div style={{ flex:1, overflowY:'auto' }}>
        {blockedUsers.length === 0 ? (
          <div style={{ textAlign:'center', padding:48, color:C.text2 }}>No blocked users</div>
        ) : blockedUsers.map(u => (
          <div key={u.id} style={{
            display:'flex', alignItems:'center', gap:14,
            padding:'14px 16px', borderBottom:`1px solid ${C.border}`,
          }}>
            <img src={u.photos[0]} style={{ width:44, height:44, borderRadius:22, objectFit:'cover' }}/>
            <div style={{ flex:1 }}>
              <div style={{ color:C.text, fontSize:15, fontWeight:600 }}>{u.name}</div>
              <div style={{ color:C.text2, fontSize:12 }}>Blocked</div>
            </div>
            <button style={{
              background:'none', border:`1px solid ${C.border}`,
              borderRadius:20, padding:'6px 14px',
              color:C.text2, fontSize:12, cursor:'pointer',
            }}>Unblock</button>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      <Header title="Safety & Settings" />

      <div style={{ flex:1, overflowY:'auto', padding:'0 0 24px' }}>
        {/* Quick exit — prominent */}
        <div style={{ padding:16 }}>
          <button style={{
            width:'100%', background:C.danger, border:'none', borderRadius:16,
            padding:'18px 0', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:10,
            boxShadow:`0 4px 20px rgba(224,92,92,0.4)`,
          }}>
            <span style={{ fontSize:20 }}>🚪</span>
            <div style={{ textAlign:'left' }}>
              <div style={{ color:'#fff', fontSize:15, fontWeight:700 }}>Quick Exit</div>
              <div style={{ color:'rgba(255,255,255,0.7)', fontSize:11 }}>Immediately close app</div>
            </div>
          </button>
        </div>

        {/* Verification */}
        <Section title="Account">
          <SettingRow label="Photo Verification" sub="Get the verified badge" right={
            <button onClick={() => setShowVerify(true)} style={{
              background:`linear-gradient(135deg,${C.accent},${C.mauve})`,
              border:'none', borderRadius:20, padding:'6px 14px',
              color:'#fff', fontSize:12, cursor:'pointer',
            }}>Verify</button>
          }/>
          <SettingRow label="Blocked users" sub={`${blockedUsers.length} blocked`} right={
            <button onClick={() => setShowBlockList(true)} style={{
              background:'none', border:`1px solid ${C.border}`,
              borderRadius:20, padding:'6px 14px',
              color:C.text2, fontSize:12, cursor:'pointer',
            }}>Manage</button>
          }/>
        </Section>

        {/* Notifications */}
        <Section title="Notifications">
          {[
            { k:'messages', label:'New messages' },
            { k:'likes', label:'Someone likes you' },
            { k:'matches', label:'New matches' },
            { k:'safety', label:'Safety alerts' },
          ].map(({ k, label }) => (
            <SettingRow key={k} label={label} right={
              <Toggle value={notif[k]} onToggle={() => setNotif(n => ({ ...n, [k]:!n[k] }))}/>
            }/>
          ))}
        </Section>

        {/* Safety resources */}
        <Section title="Safety Resources">
          {[
            { icon:'📞', label:'Crisis Text Line', sub:'Text HOME to 741741' },
            { icon:'🏳️‍🌈', label:'Trevor Project', sub:'24/7 LGBTQ+ crisis support' },
            { icon:'⚖️', label:'Community Guidelines', sub:'What we stand for' },
            { icon:'🔒', label:'Privacy Policy', sub:'How we protect your data' },
          ].map(({ icon, label, sub }) => (
            <div key={label} style={{
              display:'flex', alignItems:'center', gap:14,
              padding:'13px 16px', borderBottom:`1px solid ${C.border}`, cursor:'pointer',
            }}>
              <span style={{ fontSize:20 }}>{icon}</span>
              <div style={{ flex:1 }}>
                <div style={{ color:C.text, fontSize:14 }}>{label}</div>
                {sub && <div style={{ color:C.text2, fontSize:11, marginTop:2 }}>{sub}</div>}
              </div>
              <span style={{ color:C.text2 }}>›</span>
            </div>
          ))}
        </Section>

        <div style={{ padding:'16px 16px 0' }}>
          <button onClick={onSignOut} style={{
            width:'100%', background:'none',
            border:`1px solid ${C.danger}30`,
            borderRadius:16, padding:'14px 0',
            color:C.danger, fontSize:14, cursor:'pointer',
          }}>Sign Out</button>
        </div>
      </div>

      <QuickExit onPress={onQuickExit} />
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ marginBottom:8 }}>
      <div style={{ ...S.label, padding:'12px 16px 6px' }}>{title}</div>
      <div style={{ background:C.bgCard, borderTop:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}` }}>
        {children}
      </div>
    </div>
  );
}

function SettingRow({ label, sub, right }) {
  return (
    <div style={{
      display:'flex', alignItems:'center', justifyContent:'space-between',
      padding:'13px 16px', borderBottom:`1px solid ${C.border}`,
    }}>
      <div>
        <div style={{ color:C.text, fontSize:14 }}>{label}</div>
        {sub && <div style={{ color:C.text2, fontSize:11, marginTop:2 }}>{sub}</div>}
      </div>
      {right}
    </div>
  );
}

// ─────────────────────────────────────────────
// QUICK EXIT MODAL
// ─────────────────────────────────────────────
function QuickExitOverlay({ onClose }) {
  return (
    <div style={{
      position:'absolute', inset:0, background:'#0D0D0F', zIndex:9999,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      gap:20, padding:32,
    }}>
      <div style={{ fontSize:48 }}>🔒</div>
      <div style={{ ...S.heading, textAlign:'center' }}>App Hidden</div>
      <div style={{ color:C.text2, fontSize:14, textAlign:'center', lineHeight:1.6 }}>
        SZR is not visible to anyone nearby. Tap below to return.
      </div>
      <button onClick={onClose} style={{
        background:`linear-gradient(135deg,${C.accent},${C.mauve})`,
        border:'none', borderRadius:24, padding:'14px 40px',
        color:'#fff', fontSize:15, fontWeight:600, cursor:'pointer',
      }}>Return to SZR</button>
    </div>
  );
}

// ─────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────
function App() {
  const [screen, setScreen] = React.useState('agegate');
  const [activeTab, setActiveTab] = React.useState('grid');
  const [selectedUser, setSelectedUser] = React.useState(null);
  const [selectedConversation, setSelectedConversation] = React.useState(null);
  const [quickExitVisible, setQuickExitVisible] = React.useState(false);
  const [prevScreen, setPrevScreen] = React.useState(null);

  const navigate = (to, data=null) => {
    if (to === 'back') {
      setScreen(prevScreen || 'grid');
      return;
    }
    setPrevScreen(screen);
    if (to === 'profile-detail') { setSelectedUser(data); setScreen('profile-detail'); return; }
    if (to === 'chat-detail') { setSelectedConversation(data); setScreen('chat-detail'); return; }
    setScreen(to);
  };

  const handleChat = (user) => {
    const conv = CONVERSATIONS.find(c => c.user.id === user.id) || { id:99, user, lastMsg:'', time:'now', unread:0 };
    setSelectedConversation(conv);
    setScreen('chat-detail');
  };

  const onTab = (tab) => {
    setActiveTab(tab);
    if (tab === 'grid') setScreen('grid');
    if (tab === 'chats') setScreen('chats');
    if (tab === 'profile') setScreen('my-profile');
    if (tab === 'settings') setScreen('settings');
  };

  const showTabs = ['grid','chats','my-profile','settings'].includes(screen);

  const quickExit = () => setQuickExitVisible(true);

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', height:'100%', position:'relative', overflow:'hidden' }}>
      {quickExitVisible && <QuickExitOverlay onClose={() => setQuickExitVisible(false)} />}

      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {screen === 'agegate'      && <AgeGateScreen navigate={navigate} />}
        {screen === 'login'        && <LoginScreen navigate={navigate} />}
        {screen === 'signup'       && <SignupScreen navigate={navigate} />}
        {screen === 'grid'         && <GridScreen navigate={navigate} onQuickExit={quickExit} />}
        {screen === 'profile-detail' && <ProfileDetailScreen user={selectedUser} navigate={navigate} onChat={handleChat} />}
        {screen === 'chats'        && <ChatListScreen navigate={navigate} onQuickExit={quickExit} />}
        {screen === 'chat-detail'  && <ChatDetailScreen conversation={selectedConversation} navigate={navigate} onQuickExit={quickExit} />}
        {screen === 'my-profile'   && <MyProfileScreen onQuickExit={quickExit} />}
        {screen === 'settings'     && <SettingsScreen navigate={navigate} onQuickExit={quickExit} onSignOut={() => setScreen('login')} />}
      </div>

      {showTabs && (
        <BottomTabs active={activeTab} onTab={onTab} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
