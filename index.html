<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SZR Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 0 48px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
::-webkit-scrollbar{display:none}
.lbl{color:#444;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-align:center}
.shell{width:390px;height:844px;background:#0D0D0F;border-radius:44px;border:8px solid #2a2a2a;box-shadow:0 0 0 2px #1a1a1a,0 40px 80px rgba(0,0,0,.85),inset 0 0 0 1px #333;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#1a1a1a;border-radius:0 0 20px 20px;z-index:999;}
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;margin-top:34px;position:relative;}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0D0D0F}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hdr{display:flex;align-items:center;height:52px;padding:0 16px;background:#0D0D0F;border-bottom:1px solid #2E2832;flex-shrink:0;position:relative;}
.hdr-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:#F5F0F2}
.hdr-left{position:absolute;left:12px}
.hdr-right{position:absolute;right:12px}
.tabs{display:flex;height:64px;background:#1A1A1F;border-top:1px solid #2E2832;flex-shrink:0;}
.tab{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9E8FA0;font-size:10px;font-weight:500;font-family:inherit;transition:color .15s;}
.tab.active,.tab:hover{color:#C2527A}
.tab-icon{font-size:22px;line-height:1}
.btn-grad{border:none;border-radius:24px;padding:14px 0;background:linear-gradient(135deg,#C2527A,#8B5E8C);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;box-shadow:0 4px 16px rgba(194,82,122,.3);}
.btn-outline{border:1px solid #2E2832;border-radius:24px;padding:14px 0;background:none;color:#9E8FA0;font-size:15px;cursor:pointer;font-family:inherit;width:100%;}
.btn-icon{background:none;border:none;cursor:pointer;color:#9E8FA0;font-size:20px;padding:6px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
input,textarea{background:#222228;border:1px solid #2E2832;border-radius:12px;padding:14px 16px;color:#F5F0F2;font-size:15px;width:100%;outline:none;font-family:inherit;}
textarea{resize:none;line-height:1.5}
input::placeholder,textarea::placeholder{color:#9E8FA0}
.pill-mauve{background:rgba(139,94,140,.2);border:1px solid #8B5E8C;color:#8B5E8C;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;}
.pill-rose{background:rgba(194,82,122,.2);border:1px solid #C2527A;color:#C2527A;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;}
.pill-btn{border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;border:1px solid #2E2832;background:none;color:#9E8FA0;transition:all .15s;}
.pill-btn.sel-mauve{background:rgba(139,94,140,.2);border-color:#8B5E8C;color:#8B5E8C}
.pill-btn.sel-rose{background:rgba(194,82,122,.2);border-color:#C2527A;color:#C2527A}
.toggle{width:44px;height:24px;border-radius:12px;background:#2E2832;position:relative;cursor:pointer;transition:background .2s;border:none;flex-shrink:0}
.toggle.on{background:#C2527A}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on::after{left:22px}
.card{background:#222228;border-radius:12px;border:1px solid #2E2832}
.sec-label{font-size:12px;font-weight:500;color:#9E8FA0;text-transform:uppercase;letter-spacing:1px;padding:12px 16px 6px}
.qexit{position:absolute;bottom:76px;right:14px;z-index:800;width:48px;height:48px;border-radius:24px;background:#E05C5C;border:none;cursor:pointer;font-size:18px;color:#fff;box-shadow:0 4px 16px rgba(224,92,92,.5);display:flex;align-items:center;justify-content:center;}
.logo-box{width:96px;height:96px;border-radius:20px;background:linear-gradient(135deg,#C2527A,#8B5E8C);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(194,82,122,.35);}
.logo-text{font-size:28px;font-weight:700;color:#fff;letter-spacing:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.tile{position:relative;aspect-ratio:1/1.1;border-radius:10px;overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tgrad{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
.tname{position:absolute;bottom:6px;left:7px;color:#fff;font-size:11px;font-weight:600;line-height:1.2}
.tdist{font-size:9px;color:rgba(255,255,255,.7)}
.tonline{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:5px;background:#4CAF50;border:2px solid #0D0D0F;box-shadow:0 0 6px rgba(76,175,80,.6)}
.tverif{position:absolute;top:5px;right:5px;background:linear-gradient(135deg,#C2527A,#8B5E8C);border-radius:9px;padding:2px 5px;font-size:9px;color:#fff;font-weight:600}
.bme{background:linear-gradient(135deg,#C2527A,#8B5E8C);border-radius:18px 18px 4px 18px}
.bthem{background:#222228;border:1px solid #2E2832;border-radius:18px 18px 18px 4px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:700;display:flex;align-items:flex-end}
.sheet{background:#1A1A1F;border-radius:20px 20px 0 0;padding:24px;width:100%;border:1px solid #2E2832}
.badge{background:linear-gradient(135deg,#C2527A,#8B5E8C);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:3px;}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid #2E2832}
</style>
</head>
<body>
<div class="lbl">SZR &mdash; Interactive Prototype</div>
<div class="shell">
  <div class="notch"></div>
  <div id="app"></div>
</div>
<script>

  {id:1,name:'Zara',age:26,dist:'0.3 km',online:true,verified:true,identity:['Lesbian','Femme'],looking:['Dating','Hookup'],bio:'Coffee shops, vinyl records, and dogs that are way too big for apartments. Looking for someone to make Sunday mornings chaotic.',photos:['https://picsum.photos/seed/zara1/400/500','https://picsum.photos/seed/zara2/400/500','https://picsum.photos/seed/zara3/400/500']},

  {id:5,from:'them',text:'are you free tomorrow night?',time:'2:15 PM'}
];

var ALL_ID=['Lesbian','Bisexual','Queer','Pansexual','Sapphic','Non-binary','Trans woman','Femme','Butch','Stud','Soft butch','Chapstick'];
var ALL_LK=['Hookup','Dating','Friends','Long-term','Casual','Open to anything'];

var S={
  screen:'agegate',prev:'grid',tab:'grid',denied:false,
  user:null,convo:null,photoIdx:0,bioExp:false,liked:false,
  report:false,filter:false,menu:false,banner:true,
  msgs:INIT_MSGS.slice(),chatInput:'',edit:false,
  bio:ME.bio,name:ME.name,myId:ME.identity.slice(),myLk:ME.looking.slice(),
  incognito:false,hide:false,exactDist:false,
  notif:{messages:true,likes:true,matches:true,safety:true},
  blockList:false,verify:false,quickExit:false
};

function go(screen,data){
  S.prev=S.screen;
  if(screen==='back'){S.screen=S.prev;render();return;}
  if(data){Object.assign(S,data);}
  S.screen=screen;S.report=false;S.menu=false;S.filter=false;
  var tabMap={grid:'grid',chats:'chats','my-profile':'profile',settings:'settings'};
  if(tabMap[screen]) S.tab=tabMap[screen];
  render();
}

function h(parts){return parts.join('');}

function render(){
  var app=document.getElementById('app');
  var tabs=['grid','chats','my-profile','settings'].indexOf(S.screen)>-1;
  app.innerHTML=h([
    S.quickExit?quitOverlay():'',
    '<div class="screen">',screenHTML(),'</div>',
    tabs?tabsHTML():''
  ]);
  bindListeners();
}

function screenHTML(){
  if(S.screen==='agegate') return ageGate();
  if(S.screen==='login') return login();
  if(S.screen==='signup') return signup();
  if(S.screen==='grid') return grid();
  if(S.screen==='profile-detail') return profileDetail();
  if(S.screen==='chats') return chatList();
  if(S.screen==='chat-detail') return chatDetail();
  if(S.screen==='my-profile') return myProfile();
  if(S.screen==='settings') return settings();
  return '';
}

function ageGate(){
  if(S.denied) return h([

    '<div style="font-size:48px">&#128683;</div>',

    '</div>'
  ]);

    '<div class="scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;min-height:100%">',
    '<div class="logo-box" style="margin-bottom:14px"><span class="logo-text">SZR</span></div>',
    '<div style="color:#9E8FA0;font-size:13px;margin-bottom:36px;letter-spacing:.5px">For women who love women.</div>',
    '<div class="card" style="padding:24px;width:100%;margin-bottom:20px;display:flex;flex-direction:column;gap:14px">',
    '<div style="font-size:20px;font-weight:600;color:#F5F0F2;text-align:center">Are you 18 or older?</div>',

    '<button class="btn-grad" data-a="agegate-yes">Yes, I am 18+</button>',
    '<button class="btn-outline" data-a="agegate-no">No, I am under 18</button>',
    '</div>',
    '<div style="font-size:11px;color:#9E8FA0;text-align:center;opacity:.5;line-height:1.6">By continuing you agree to our Terms of Service and Privacy Policy.</div>',
    '</div>'
  ]);
}

  return h([
    '<div class="scroll" style="display:flex;flex-direction:column;min-height:100%">',
    '<div style="padding:48px 32px 24px;display:flex;flex-direction:column;align-items:center;gap:8px">',

    '<div style="display:flex;align-items:center;gap:12px;margin-top:4px"><div style="flex:1;height:1px;background:#2E2832"></div><span style="color:#9E8FA0;font-size:12px">or</span><div style="flex:1;height:1px;background:#2E2832"></div></div>',

    '<button class="btn-outline" style="margin-bottom:32px" data-a="login">Continue with Google</button>',

  ]);

function signup(){
  return h([
    '<div class="scroll" style="display:flex;flex-direction:column;min-height:100%">',
    '<div style="padding:32px 24px 0;display:flex;align-items:center;gap:12px">',

    '</div></div>'
  ]);
}

function grid(){
  var filter='';
  if(S.filter){
    filter=h([
      '<div style="background:#1A1A1F;border-bottom:1px solid #2E2832;padding:12px 16px;display:flex;flex-direction:column;gap:10px">',
      '<div style="font-size:12px;font-weight:500;color:#9E8FA0;text-transform:uppercase;letter-spacing:1px">Filters</div>',
      '<div style="display:flex;gap:8px;flex-wrap:wrap">',
      ['Nearby','Online now','Verified','New faces'].map(function(f,i){
        return '<button style="background:'+(i===0?'linear-gradient(135deg,#C2527A,#8B5E8C)':'none')+';border:1px solid '+(i===0?'#C2527A':'#2E2832')+';border-radius:20px;padding:6px 14px;color:'+(i===0?'#fff':'#9E8FA0')+';font-size:12px;cursor:pointer;font-family:inherit">'+f+'</button>';
      }).join(''),
      '</div>',
      '<div style="display:flex;gap:12px;align-items:center"><span style="color:#9E8FA0;font-size:13px">Max distance:</span><input type="range" min="1" max="50" value="10" style="flex:1;accent-color:#C2527A"/><span style="color:#F5F0F2;font-size:13px;width:36px">10 km</span></div>',
      '</div>'
    ]);
  }
  var tiles=USERS.map(function(u){
    return h([
      '<div class="tile" data-a="open-profile" data-uid="'+u.id+'">',
      '<img src="'+u.photos[0]+'" loading="lazy" alt="'+u.name+'"/>',
      '<div class="tgrad"></div>',
      u.online?'<div class="tonline"></div>':'',

    '<div class="hdr">',
    '<div class="hdr-left"><button class="btn-icon" data-a="toggle-filter">&#9881;</button></div>',
    '<div class="hdr-title" style="background:linear-gradient(135deg,#C2527A,#8B5E8C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px;font-weight:700;letter-spacing:3px">SZR</div>',

function profileDetail(){

    dots=u.photos.map(function(_,i){
      return '<button data-a="photo-dot" data-idx="'+i+'" style="width:'+(i===S.photoIdx?20:6)+'px;height:6px;border-radius:3px;background:'+(i===S.photoIdx?'#C2527A':'rgba(255,255,255,.4)')+';border:none;cursor:pointer;padding:0"></button>';
    }).join('');
  }
  var bio=S.bioExp||u.bio.length<80?u.bio:u.bio.slice(0,80)+'...';
  return h([
    '<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">',
    '<div style="position:relative;height:55%;flex-shrink:0">',
    '<img src="'+u.photos[S.photoIdx]+'" style="width:100%;height:100%;object-fit:cover;display:block"/>',
    '<div style="position:absolute;top:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)"></div>',

    u.photos.length>1?'<div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px">'+dots+'</div>':'',
    u.photos.length>1?'<div data-a="photo-prev" style="position:absolute;top:0;left:0;width:40%;height:100%;cursor:pointer"></div><div data-a="photo-next" style="position:absolute;top:0;right:0;width:40%;height:100%;cursor:pointer"></div>':'',
    '</div>',
    '<div class="scroll" style="padding:0 16px 16px">',
    '<div style="display:flex;align-items:center;gap:10px;margin:10px 0 4px">',
    '<span style="font-size:24px;font-weight:700;color:#F5F0F2">'+u.name+'</span>',

}

function bindListeners(){
  var bottom=document.getElementById('msg-bottom');
  if(bottom) bottom.scrollIntoView();
  var ci=document.getElementById('chat-input');
  if(ci){
    ci.addEventListener('input',function(e){S.chatInput=e.target.value;});
    ci.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendMsg();}});
  }
  document.getElementById('app').addEventListener('click',onClick);
}

function onClick(e){
  var el=e.target;
  while(el&&el!==document.getElementById('app')){
    var a=el.dataset.a;
    if(a){act(a,el);return;}
    el=el.parentElement;
  }
}

function act(a,el){
  if(a==='agegate-yes'){go('login');}
  else if(a==='agegate-no'){S.denied=true;render();}
  else if(a==='login'){go('grid');}
  else if(a==='goto-signup'){go('signup');}
  else if(a==='back'){go(S.prev);}
  else if(a==='toggle-filter'){S.filter=!S.filter;render();}
  else if(a==='open-profile'){
    var u=null;for(var i=0;i<USERS.length;i++){if(USERS[i].id===+el.dataset.uid){u=USERS[i];break;}}
    go('profile-detail',{user:u,photoIdx:0,liked:false,bioExp:false});
  }
  else if(a==='open-chat'){
    var u2=S.user,c=null;for(var j=0;j<CONVOS.length;j++){if(CONVOS[j].user.id===u2.id){c=CONVOS[j];break;}}
    if(!c) c={id:99,user:u2,last:'',time:'now',unread:0};
    go('chat-detail',{convo:c,msgs:INIT_MSGS.slice(),banner:true});
  }
  else if(a==='toggle-like'){S.liked=!S.liked;render();}
  else if(a==='toggle-bio'){S.bioExp=!S.bioExp;render();}
  else if(a==='show-report'){S.report=true;render();}
  else if(a==='close-report'){S.report=false;render();}
  else if(a==='open-convo'){
    var c2=null;for(var k=0;k<CONVOS.length;k++){if(CONVOS[k].id===+el.dataset.cid){c2=CONVOS[k];break;}}
    go('chat-detail',{convo:c2,msgs:INIT_MSGS.slice(),banner:true});
  }
  else if(a==='toggle-menu'){S.menu=!S.menu;render();}
  else if(a==='close-menu'){S.menu=false;render();}
  else if(a==='dismiss-banner'){S.banner=false;render();}
  else if(a==='send-msg'){sendMsg();}
  else if(a==='open-profile-from-chat'){
    var u3=S.convo?S.convo.user:USERS[0];
    go('profile-detail',{user:u3,photoIdx:0,liked:false,bioExp:false});
  }
  else if(a==='tab'){
    S.tab=el.dataset.tab;
    var map={grid:'grid',chats:'chats',profile:'my-profile',settings:'settings'};
    go(map[el.dataset.tab]||el.dataset.tab);
  }
  else if(a==='toggle-edit'){S.edit=!S.edit;render();}
  else if(a==='toggle-id'){
    var t=el.dataset.tag;if(!S.edit)return;
    var idx=S.myId.indexOf(t);if(idx>-1)S.myId.splice(idx,1);else S.myId.push(t);render();
  }
  else if(a==='toggle-lk'){
    var t2=el.dataset.tag;if(!S.edit)return;
    var idx2=S.myLk.indexOf(t2);if(idx2>-1)S.myLk.splice(idx2,1);else S.myLk.push(t2);render();
  }
  else if(a==='toggle-priv'){var kk=el.dataset.key;S[kk]=!S[kk];render();}
  else if(a==='toggle-notif'){var kn=el.dataset.key;S.notif[kn]=!S.notif[kn];render();}
  else if(a==='show-verify'){S.verify=true;render();}
  else if(a==='close-verify'){S.verify=false;render();}
  else if(a==='show-blocklist'){S.blockList=true;render();}
  else if(a==='close-blocklist'){S.blockList=false;render();}
  else if(a==='quick-exit'){S.quickExit=true;render();}
  else if(a==='close-qexit'){S.quickExit=false;render();}
  else if(a==='sign-out'){go('login');}
  else if(a==='photo-dot'){S.photoIdx=+el.dataset.idx;render();}
  else if(a==='photo-prev'){S.photoIdx=Math.max(0,S.photoIdx-1);render();}
  else if(a==='photo-next'){var u4=S.user;if(u4)S.photoIdx=Math.min(u4.photos.length-1,S.photoIdx+1);render();}
}

function sendMsg(){
  var ci=document.getElementById('chat-input');
  var text=(ci?ci.value:S.chatInput).trim();
  if(!text) return;
  S.msgs.push({id:Date.now(),from:'me',text:text,time:'now'});
  S.chatInput='';
  render();
}

render();
</script>
</body>
</html>
